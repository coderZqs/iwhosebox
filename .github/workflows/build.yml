name: Flutter iOS Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build12345' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Disable Swift Package Manager (Prevent Duplicate Symbols Conflict)
        run: flutter config --no-enable-swift-package-manager

      - name: Install Certificate into Keychain & Import Provisioning Profile
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing Certificate into Keychain..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/build_certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security import $RUNNER_TEMP/build_certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
            security list-keychains -s $KEYCHAIN_PATH
          else
            echo "::error ::BUILD_CERTIFICATE_BASE64 secret is missing!"
            exit 1
          fi

          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Installing Provisioning Profile..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/comiwhoseboxrelease.mobileprovision
          else
            echo "::error ::BUILD_PROVISION_PROFILE_BASE64 secret is missing!"
            exit 1
          fi

      - name: Install Dependencies & Update CocoaPods
        run: |
          flutter pub get
          cd ios
          pod repo update || true
          cd ..

      - name: Build Official Signed IPA via Xcode Export
        run: flutter build ipa --release --export-options-plist=ios/exportOptions.plist

      - name: Upload iOS Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: build/ios/ipa/*.ipa
