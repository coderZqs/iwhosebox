name: Flutter iOS Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build12345' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Disable Swift Package Manager (Prevent Duplicate Symbols Conflict)
        run: flutter config --no-enable-swift-package-manager

      - name: Install Certificate into Keychain
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing Certificate into Keychain..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/build_certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security import $RUNNER_TEMP/build_certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
            security list-keychains -s $KEYCHAIN_PATH
          else
            echo "::warning ::BUILD_CERTIFICATE_BASE64 secret is missing or empty!"
          fi

      - name: Install Dependencies & Update CocoaPods
        run: |
          flutter pub get
          cd ios
          pod repo update || true
          cd ..

      - name: Build iOS Application Payload
        run: flutter build ios --release --no-codesign

      - name: Force Embed Provisioning Profile & Codesign App
        run: |
          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > build/ios/iphoneos/Runner.app/embedded.mobileprovision
            echo "Successfully created build/ios/iphoneos/Runner.app/embedded.mobileprovision"
          else
            echo "::error ::BUILD_PROVISION_PROFILE_BASE64 secret is missing or empty! Cannot create embedded.mobileprovision!"
          fi

          IDENTITY=$(security find-identity -v -p codesigning | grep -E "Apple (Distribution|Development)" | head -n 1 | awk -F '"' '{print $2}')
          if [ -n "$IDENTITY" ]; then
            echo "Codesigning Runner.app with identity: $IDENTITY"
            codesign --force --deep --sign "$IDENTITY" build/ios/iphoneos/Runner.app || true
          else
            echo "::warning ::No codesigning identity found in Keychain. Signed with ad-hoc/unsigned."
          fi

      - name: Create IPA Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r iwhosebox-release.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: build/ios/iphoneos/iwhosebox-release.ipa
