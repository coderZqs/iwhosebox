name: Flutter iOS Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build12345' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Disable Swift Package Manager (Prevent Duplicate Symbols Conflict)
        run: flutter config --no-enable-swift-package-manager

      - name: Install Certificate into Keychain & Import Provisioning Profile
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing Certificate into Keychain..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/build_certificate.p12
            
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            security import $RUNNER_TEMP/build_certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/productsign
            
            security default-keychain -s $KEYCHAIN_PATH
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          else
            echo "::error ::BUILD_CERTIFICATE_BASE64 secret is missing!"
            exit 1
          fi

          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Installing Provisioning Profile..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
            
            PROFILE_UUID=$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision | grep -A1 "<key>UUID</key>" | tail -n1 | sed -e 's/.*<string>\(.*\)<\/string>.*/\1/')
            echo "Extracted Provisioning Profile UUID: $PROFILE_UUID"
            
            cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
            cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/comiwhoseboxrelease.mobileprovision
          else
            echo "::error ::BUILD_PROVISION_PROFILE_BASE64 secret is missing!"
            exit 1
          fi

      - name: Install Dependencies & Update CocoaPods
        run: |
          flutter pub get
          cd ios
          pod repo update || true
          cd ..

      - name: Compile Flutter iOS Release Payload
        run: flutter build ios --release --no-codesign

      - name: Package & Codesign IPA Product
        run: |
          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_FILE=$(ls $PROFILES_DIR/*.mobileprovision 2>/dev/null | head -n 1)
          
          APP_PATH="$GITHUB_WORKSPACE/build/ios/iphoneos/Runner.app"
          OUTPUT_DIR="$GITHUB_WORKSPACE/output-ipa"
          
          if [ -d "$APP_PATH" ]; then
            echo "Found Runner.app, embedding provisioning profile..."
            cp "$PROFILE_FILE" "$APP_PATH/embedded.mobileprovision"
            
            IDENTITY=$(security find-identity -v -p codesigning | grep -E "Apple Distribution|iPhone Distribution" | head -n 1 | awk -F '"' '{print $2}')
            if [ -n "$IDENTITY" ]; then
              echo "Codesigning Frameworks and Runner.app with Identity: $IDENTITY"
              find "$APP_PATH/Frameworks" -name "*.framework" -o -name "*.dylib" 2>/dev/null | xargs -I {} codesign --force --deep --sign "$IDENTITY" {} || true
              codesign --force --deep --sign "$IDENTITY" "$APP_PATH"
            else
              echo "::warning ::No Apple Distribution identity found in Keychain!"
            fi
            
            mkdir -p "$OUTPUT_DIR/Payload"
            cp -r "$APP_PATH" "$OUTPUT_DIR/Payload/"
            cd "$OUTPUT_DIR"
            zip -r iwhosebox-release.ipa Payload
            rm -rf Payload
            
            echo "SUCCESS: Created $OUTPUT_DIR/iwhosebox-release.ipa"
            ls -la "$OUTPUT_DIR"
          else
            echo "::error ::Runner.app does not exist at $APP_PATH!"
            exit 1
          fi

      - name: Upload iOS Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: output-ipa/iwhosebox-release.ipa
